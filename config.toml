# Aparencia e ajustes da pagina. O Streamlit le este arquivo sozinho, no seu
# computador e no Streamlit Community Cloud. A pagina segue o modo claro ou
# escuro do navegador; da para trocar no menu (tres pontos) > Settings.

[server]
enableStaticServing = true        # serve as fontes da pasta static/

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
font = "'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
headingFont = "'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif"
codeFont = "'IBM Plex Mono', Consolas, 'Courier New', monospace"
baseRadius = "10px"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/ibm-plex-sans-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/ibm-plex-sans-latin-500-normal.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/ibm-plex-sans-latin-600-normal.woff2"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/ibm-plex-sans-latin-700-normal.woff2"
weight = 700

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/ibm-plex-mono-latin-400-normal.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/ibm-plex-mono-latin-500-normal.woff2"
weight = 500

[theme.light]
primaryColor = "#1a56b8"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#e8edf4"
textColor = "#131c28"

[theme.dark]
primaryColor = "#78b0f5"
backgroundColor = "#0c131b"
secondaryBackgroundColor = "#17212e"
textColor = "#e6edf5"
