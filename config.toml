# Aparencia e ajustes da pagina. O Streamlit le este arquivo sozinho,
# tanto no seu computador quanto no Streamlit Community Cloud.

[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#fafbfc"
secondaryBackgroundColor = "#edf1f5"
textColor = "#1b2a3d"
font = "'Segoe UI', system-ui, sans-serif"
headingFont = "'Cascadia Mono', Consolas, 'Courier New', monospace"
baseRadius = "6px"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
